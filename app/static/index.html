<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Arduino Control Dashboard</title>
        <style>
            @keyframes glow {
                0% { text-shadow: 0 0 5px #00ffcc, 0 0 10px #00ffcc, 0 0 15px #00ffcc; }
                50% { text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc, 0 0 30px #00ffcc; }
                100% { text-shadow: 0 0 5px #00ffcc, 0 0 10px #00ffcc, 0 0 15px #00ffcc; }
            }
            @keyframes glitch {
                0% { text-shadow: 2px 2px #ff00ff, -2px -2px #00ffff; }
                50% { text-shadow: -2px -2px #ff00ff, 2px 2px #00ffff; }
                100% { text-shadow: 2px 2px #ff00ff, -2px -2px #00ffff; }
            }
            @keyframes scanlines {
                0% { background-position: 0 0; }
                100% { background-position: 0 100px; }
            }
            body {
                background-color: #02121e;
                color: #00ffcc;
                font-family: 'Lucida Console', Monaco, monospace;
                text-align: center;
                position: relative;
                overflow: hidden;
            }
            body::before {
                content: "";
                position: absolute;
                top: 0; left: 0; right: 0; bottom: 0;
                background: repeating-linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, 0.1) 0px,
                    rgba(0, 0, 0, 0.2) 3px,
                    transparent 6px
                );
                animation: scanlines 1s infinite linear;
                pointer-events: none;
            }
            .container {
                margin-top: 50px;
            }
            h1 {
                animation: glow 1.5s infinite alternate, glitch 0.2s infinite alternate;
                font-size: 26px;
            }
            .button {
                background-color: #002b36;
                border: 2px solid #00ffcc;
                color: #00ffcc;
                padding: 15px 30px;
                font-size: 20px;
                cursor: pointer;
                margin: 10px;
                transition: all 0.3s;
                font-family: 'Lucida Console', Monaco, monospace;
                text-transform: uppercase;
            }
            .button:hover {
                background-color: #00ffcc;
                color: black;
            }
            .terminal {
                border: 2px solid #00ffcc;
                background-color: #001b26;
                padding: 20px;
                width: 80%;
                margin: 20px auto;
                text-align: left;
                font-size: 18px;
                min-height: 200px;
                font-family: 'Lucida Console', Monaco, monospace;
                color: #00ffcc;
                animation: glitch 0.1s infinite alternate;
            }
        </style>
        <script>
            function sendCommand(state) {
                fetch(`/led/${state}`, { method: 'POST' })
                    .then(response => response.json())
                    .then(data => {
                        document.getElementById('terminal').innerHTML += `<br />> ${data.status}\n`;
                    })
                    .catch(error => {
                        document.getElementById('terminal').innerHTML += `<br />> ERROR: ${error}\n`;
                    });
            }
        </script>
    </head>
    <body>
        <div class="container">
            <h1>ARDUINO CONTROL SYSTEM</h1>
            <button class="button" onclick="sendCommand('on')">TURN ON</button>
            <button class="button" onclick="sendCommand('off')">TURN OFF</button>
            <div class="terminal" id="terminal">> SYSTEM READY...
            </div>
        </div>
    </body>
</html>
